name: Build Dylib

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Theos
        uses: Randomblock1/theos-action@v1

      - name: Install ldid
        run: brew install ldid

      - name: Build
        run: |
          make clean || true
          make package

      - name: Find and copy dylib
        run: |
          echo "=== All dylib files ==="
          find . -name "*.dylib" -type f -not -path "./.git/*"
          DY=$(find .theos -name "KYREXIPAA.dylib" -type f | head -n 1)
          if [ -z "$DY" ]; then
            DY=$(find .theos -name "*.dylib" -type f | head -n 1)
          fi
          echo "Picked: $DY"
          cp "$DY" KYREXIPAA.dylib
          ls -la KYREXIPAA.dylib

      - name: Commit dylib to repo
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -f KYREXIPAA.dylib
          git commit -m "Build KYREXIPAA.dylib [skip ci]" || true
          git push || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: KYREXIPAA-dylib
          path: KYREXIPAA.dylib
          if-no-files-found: error
