name: Build Dylib

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Setup Theos
        uses: Randomblock1/theos-action@v1

      - name: Install ldid
        run: brew install ldid

      - name: Build
        run: |
          make clean || true
          make package

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: KYREXIPAA-dylib
          path: .theos/obj/KYREXIPAA.dylib
