name: Build Dylib

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Setup Theos
        uses: Randomblock1/theos-action@v1

      - name: Install ldid
        run: brew install ldid

      - name: Build
        run: |
          make clean || true
          make package

      - name: Find built files
        run: |
          echo "=== Searching for dylib and deb ==="
          find .theos -name "*.dylib" -type f
          find packages -name "*.deb" -type f 2>/dev/null || true

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: KYREXIPAA-dylib
          path: |
            .theos/**/*.dylib
            packages/*.deb
          if-no-files-found: error
